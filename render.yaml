services:
  # ===================================================
  # Backend — Flask API (EfficientNet-B0 Classification)
  # ===================================================
  - type: web
    name: pneumoai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: FLASK_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: CORS_ORIGINS
        value: https://pneumoai-frontend.onrender.com,http://localhost:5173
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9

  # ===================================================
  # Frontend — React (Vite) Static Site
  # ===================================================
  - type: web
    name: pneumoai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://pneumoai-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
